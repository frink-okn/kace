kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "kace.fullname" . }}-role
rules:
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
    - configmaps
    - pods
    - secrets
    - services
    - persistentvolumeclaims
  verbs:
    - create
    - delete
    - deletecollection
    - get
    - list
    - patch
    - update
    - watch
# Job failures are reported by reading the failed pod's logs
# (JobMan._get_pod_logs_for_job); without this subresource the error says
# "<unavailable>" exactly when the reason matters.
- apiGroups:
  - ""
  resources:
    - pods/log
  verbs:
    - get
    - list
- apiGroups:
  - "apps"
  resources:
    - deployments
    - deployments/scale
    - replicasets
    - replicasets/scale
  verbs:
    - create
    - delete
    - deletecollection
    - get
    - list
    - patch
    - update
    - watch
- apiGroups:
  - "batch"
  resources:
  - jobs
  verbs:
  - create
  - delete
  - deletecollection
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
    - "networking.k8s.io"
  resources:
    - "ingresses"
  verbs:
    - create
    - delete
    - deletecollection
    - get
    - list
    - patch
    - update
    - watch
{{- if .Values.rbac.serving }}
# Routing and autoscaling objects for the SPARQL endpoints. Only needed where
# those endpoints are actually created. When KACE runs its batch work on one
# cluster and manages serving on another, the serving cluster grants these to
# the remote ServiceAccount instead (deploy/gke-remote-rbac.yaml) and the batch
# cluster sets rbac.serving=false -- these CRDs do not exist there, and RBAC
# refuses to let an installer grant permissions they do not themselves hold.
- apiGroups:
    - "gateway.networking.k8s.io"
  resources:
    - "httproutes"
  verbs:
    - create
    - delete
    - deletecollection
    - get
    - list
    - patch
    - update
    - watch
- apiGroups:
    - "networking.gke.io"
  resources:
    - "healthcheckpolicies"
    - "gcpbackendpolicies"
  verbs:
    - create
    - delete
    - deletecollection
    - get
    - list
    - patch
    - update
    - watch
# KEDA owns the replica count of every per-KG QLever Deployment, so KACE has to
# be able to create the HTTPScaledObject that says so when it provisions a KG.
- apiGroups:
    - "http.keda.sh"
  resources:
    - "httpscaledobjects"
  verbs:
    - create
    - delete
    - deletecollection
    - get
    - list
    - patch
    - update
    - watch
{{- end }}
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "kace.fullname" . }}-rolebinding
subjects:
- kind: ServiceAccount
  name: {{ include "kace.fullname" . }}
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "kace.fullname" . }}-role
  apiGroup: rbac.authorization.k8s.io