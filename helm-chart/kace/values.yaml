# Default values for kace.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

# Worker mode: "celery" (default) or "temporal"
workerMode: "celery"

image:
  repository: containers.renci.org/frink/kace
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "v0.0.9"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext:
   fsGroup: 0
   fsGroupChangePolicy: OnRootMismatch

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

# Shared secret every webhook request must send as `X-KACE-Token`.
# Kept out of app_config on purpose: app_config values are rendered as plaintext
# env in the pod spec by the kace.env_variables helper. Create the Secret yourself:
#   kubectl create secret generic kace-webhook-token --from-literal=token=$(openssl rand -hex 32)
# The same value goes on the lakeFS server as LAKEFSACTIONS_KACE_TOKEN (lakeFS
# blocks env vars not carrying that prefix) and is referenced from each action's
# hook properties: headers: {X-KACE-Token: "{{ ENV.LAKEFSACTIONS_KACE_TOKEN }}"}
webhookToken:
  secretName: "kace-webhook-token"
  secretKey: "token"

# Credentials for the SERVING cluster (GKE), used when KACE runs its batch work
# on one cluster and manages SPARQL endpoints on another. Leave secretName empty
# for single-cluster mode -- every "remote" call then stays local and nothing in
# the behavior changes. Create the Secret from a static kubeconfig (SA token +
# CA + server URL, NOT a gcloud exec-plugin one); see deploy/gke-remote-rbac.yaml:
#   kubectl create secret generic kace-remote-kubeconfig --from-file=config=./gke.kubeconfig
# and set app_config.remote_kubeconfig to /etc/kace/remote/<key>.
remoteCluster:
  secretName: ""

# Does THIS install create the SPARQL serving objects (HTTPRoute, GKE
# HealthCheckPolicy/GCPBackendPolicy, KEDA HTTPScaledObject) in its own
# namespace? True for a single-cluster install and for the serving cluster.
# Set false on a batch-only cluster: those CRDs are not installed there, and
# Kubernetes rejects a Role granting permissions the installer does not hold.
rbac:
  serving: true

# HMAC credentials for qlever_index_bucket. Kept in a Secret rather than
# app_config for the same reason as the webhook token: app_config renders as
# plaintext env in the pod spec.
#   kubectl create secret generic kace-index-bucket \
#     --from-literal=access_key=... --from-literal=secret_key=...
indexBucket:
  secretName: ""
  accessKeyKey: "access_key"
  secretKeyKey: "secret_key"

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
    # Second layer in front of the shared-secret check: only lakeFS (and your
    # operators) should be able to reach these endpoints at all.
    # nginx.ingress.kubernetes.io/whitelist-source-range: "10.0.0.0/8,<lakefs egress CIDR>"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
   limits:
     cpu: 3
     memory: 4Gi
     ephemeral-storage: 100Mi
   requests:
     cpu: 100m
     memory: 128Mi
     ephemeral-storage: 20Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Celery Redis sidecar (only used when workerMode: celery)
redis:
  image:
    repository: docker.io/redis
    tag: alpine3.22
  resources:
    limits:
      cpu: 100m
      memory: 1Gi
      ephemeral-storage: 20Mi
    requests:
      cpu: 100m
      memory: 128Mi
      ephemeral-storage: 20Mi

# Temporal worker resources (only used when workerMode: temporal)
temporal_worker:
  resources:
    limits:
      cpu: 1
      memory: 2Gi
      ephemeral-storage: 100Mi
    requests:
      cpu: 100m
      memory: 256Mi
      ephemeral-storage: 20Mi

# PostgreSQL for Temporal
temporal_pg:
  internal: true                # true = deploy StatefulSet, false = use external
  image: postgres:16-alpine
  storage: 5Gi
  storageClass: ""
  user: temporal
  password: "temporal"          # change in production or use existingSecret
  existingSecret: ""            # K8s secret name (must have key "password")
  secretKey: "password"
  # External PG settings (used when internal: false)
  host: ""
  port: 5432
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

command:
  entry: "server:app"
app_config:
  # Conversion memory derivation, when an action states only `memory`:
  #   hdtc   --memory-limit  = memory * hdtc_memory_fraction  (floor 2GiB)
  #   qlever --stxxl-memory  = memory * stxxl_memory_fraction
  # Both flags are SOFT budgets for internal buffers, not caps on RSS, so
  # neither can sit at parity with the pod: hdtc at 93% of its pod was
  # OOMKilled. QLever's real need is numBlocks * numColumns * 500kB -- a
  # property of the data, not the pod -- so its fraction is only a proxy; raise
  # it when a build reports "Insufficient memory for merging N blocks".
  hdtc_memory_fraction: "0.75"
  stxxl_memory_fraction: "0.5"

  # Serve every endpoint under this path prefix (e.g. "/kace" -> POST
  # /kace/convert_to_hdt). The app mounts itself there, so an ingress can route
  # by plain path with no rewrite annotations. Empty = served at the root.
  webhook_path_prefix: ""

  lakefs_url: "http://lakefs"
  lakefs_access_key: ""
  lakefs_secret_key: ""
  # mount location of shared pvc
  shared_data_dir: ""
  # mount location of local-pvc
  local_data_dir: "/local/"
  # this will create a pvc
  local_pvc_name: "kace-local-pvc"
  # shared with other components, useful for deployment.
  shared_pvc_name: ""
  local_pvc_size: 20Gi
  local_pvc_storage_class: ""
  # Temporal config (used when workerMode: temporal)
  temporal_host: ""             # auto-detected if empty
  temporal_namespace: "default"
  # Networking mode: "gateway" (HTTPRoute + HealthCheckPolicy) or "ingress" (Kubernetes Ingress)
#  networking_mode: "gateway"
  # Comma-separated lakefs repo names that bypass KG registry lookup (synthetic KG used).
  conversion_skip_repos: "wikidata"
  # LDF aggregator (single multi-KG LDF deployment)
  ldf_pvc_name: "frink-ldf-data"
  ldf_pvc_size: "1Ti"
  ldf_pvc_storage_class: "shared-ssd-sc"
  ldf_replicas: "1"
  ldf_image: "containers.renci.org/frink/ldf-server:2023-09-13"
  ldf_extra_datasources: '[{"title":"Wikidata","data_source_path":"wikidata","hdt_file_name":"wikidata-all.hdt"},{"title":"Ubergraph","data_source_path":"ubergraph","hdt_file_name":"ubergraph.hdt"}]'
  ldf_sync_image: ""
  ldf_host_name: "frink.apps.renci.org"
  # QLever federated index build (QLeverIndexWorkflow)
  # Indexer image -- the build that WRITES index files, and the one the
  # federated server runs (so it can read what that build produced).
  #
  # Pinned to a pre-3159 build on purpose. QLever PR 3159 (merged 2026-09-01)
  # changed the on-disk index format: a post-3159 server cannot read an index
  # written before it, and that is what broke the per-KG servers when :latest
  # moved. Every existing index was written by commit-99b6db5.
  #
  # Migrating means moving qlever_image and qlever_server_image TOGETHER, and
  # either rebuilding each index or running `qlever-upgrade-index` (upstream
  # reports ~10x faster than a rebuild, keeping the old index alongside).
  # Bumping qlever_image alone also re-triggers the federated build: change
  # detection compares the configured image against the one in state.
  qlever_image: "adfreiburg/qlever:commit-99b6db5"
  # Per-KG QLever server image. Pinned, not :latest -- a server can only read an
  # index whose format its build understands, so an unpinned tag turns any
  # upstream push into an unannounced fleet-wide format change.
  qlever_server_image: "adfreiburg/qlever:commit-70c9f855d0"
  qlever_indexer_cpu: "8"
  qlever_indexer_memory: "64Gi"
  qlever_indexer_stxxl_memory: "10G"
  qlever_index_pvc_size: "3Ti"
  # Storage class for the PVC the indexer WRITES (build cluster).
  qlever_index_pvc_storage_class: "premium-rwo"
  # Storage class for the PVC the federation server MOUNTS (serving cluster).
  # Same value in single-cluster mode; they diverge once the two are split.
  qlever_index_serving_storage_class: "premium-rwo"
  # Bucket used to move a finished index from the build cluster to the serving
  # cluster (an RWO PVC cannot span clusters). Empty = single-cluster mode: the
  # build PVC is the serving PVC and no transfer happens. GCS works via its
  # S3-compatible endpoint with HMAC keys; set a lifecycle rule on the bucket so
  # old builds expire instead of accumulating terabytes.
  qlever_index_bucket: ""
  qlever_index_bucket_endpoint: "https://storage.googleapis.com"
  qlever_source_path: "/shared/qlever-source"
  qlever_state_configmap: "kace-qlever-state"
  qlever_index_pvc_prefix: "kace-qlever-index-"
  qlever_index_previous_ttl_hours: "24"
  qlever_download_concurrency: "2"
  LAKEFS_DOWNLOAD_PARTS: "4"
  qlever_num_triples_per_batch: "5000000"
  # QLever federation server (/federation)
  qlever_federation_cpu: "8"
  qlever_federation_memory: "50Gi"
  qlever_federation_cache_pct: "0.30"
  qlever_federation_index_basename: "frink"
  qlever_federation_prefix: "federation"
  qlever_federation_extra_args: ""
  # Weekly QLever index build schedule (Temporal Schedule, upserted on worker boot).
  # Default fires Friday 18:00 UTC; ~1d17h build finishes before Sunday night.
  # A finished index build normally kicks the federation server rollover. Set
  # false where the index is built but served elsewhere and the transfer/remote
  # credentials are not wired up yet -- otherwise the rollover tries to create
  # serving objects on the build cluster.
  qlever_federation_rollover_enabled: "true"
  qlever_index_schedule_enabled: "true"
  qlever_index_schedule_id: "qlever-index-weekly"
  qlever_index_schedule_cron: "0 18 * * 5"
  qlever_index_schedule_timezone: "UTC"

# Temporal server subchart
temporal:
  enabled: false
  server:
    config:
      persistence:
        numHistoryShards: 512
        datastores:
          default:
            sql:
              pluginName: postgres12_pgx
              databaseName: temporal
              # Format: <release-fullname>-temporal-pg:<port>
              # Override if your release name != "kace" or using external PG
              connectAddr: "kace-temporal-pg:5432"
              connectProtocol: "tcp"
              user: temporal
              password: temporal
              maxConns: 4
              maxIdleConns: 4
          visibility:
            sql:
              pluginName: postgres12_pgx
              databaseName: temporal_visibility
              connectAddr: "kace-temporal-pg:5432"
              connectProtocol: "tcp"
              user: temporal
              password: temporal
              maxConns: 4
              maxIdleConns: 4
      namespaces:
        create: true
        namespace:
          - name: default
            retention: 30d
  web:
    enabled: true

